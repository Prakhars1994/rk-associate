<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK Associates - Client Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .navbar {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar-logo { font-size: 20px; font-weight: bold; }
    .navbar-menu { display: flex; gap: 20px; }
    .navbar-menu a { color: white; text-decoration: none; cursor: pointer; transition: opacity 0.3s; }
    .navbar-menu a:hover { opacity: 0.8; }
    .user-info { display: flex; gap: 10px; align-items: center; font-size: 12px; }
    .logout-btn { background: #ff6b35; padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; color: white; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #1e3c72;
      border-bottom-color: #1e3c72;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Dashboard */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .stat-number { font-size: 32px; font-weight: bold; color: #1e3c72; }
    .stat-label { font-size: 14px; color: #666; margin-top: 5px; }

    /* Tickets */
    .tickets-list {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .ticket-item {
      padding: 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ticket-item:hover { background: #f9f9f9; }

    .ticket-info { flex: 1; }
    .ticket-number { font-weight: bold; color: #1e3c72; }
    .ticket-subject { margin-top: 5px; font-size: 14px; }
    .ticket-date { font-size: 12px; color: #999; margin-top: 3px; }

    .ticket-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-open { background: #e3f2fd; color: #1976d2; }
    .status-progress { background: #fff3e0; color: #f57c00; }
    .status-resolved { background: #e8f5e9; color: #388e3c; }

    .priority { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .priority-high { background: #ffebee; color: #c62828; }
    .priority-medium { background: #fff3e0; color: #f57c00; }
    .priority-low { background: #e8f5e9; color: #388e3c; }

    /* Create Ticket Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea { resize: vertical; min-height: 120px; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-primary { background: #1e3c72; color: white; }
    .btn-primary:hover { background: #152a53; }

    .btn-secondary { background: #666; color: white; }
    .btn-secondary:hover { background: #555; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    /* Files */
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .file-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .file-card:hover { transform: translateY(-2px); }
    .file-icon { font-size: 32px; margin-bottom: 8px; }
    .file-name { font-size: 12px; font-weight: 500; color: #333; word-break: break-all; }
    .file-size { font-size: 11px; color: #999; margin-top: 4px; }

    /* Comments */
    .comments-section {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    .comment {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .comment-author { font-weight: bold; color: #1e3c72; font-size: 13px; }
    .comment-text { margin-top: 6px; font-size: 14px; color: #333; }
    .comment-date { font-size: 11px; color: #999; margin-top: 6px; }
    .comment-internal { background: #fff3cd; border-left: 3px solid #ffc107; }

    @media (max-width: 768px) {
      .navbar-menu { flex-direction: column; gap: 10px; font-size: 12px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .ticket-item { flex-direction: column; align-items: flex-start; }
      .ticket-status { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="navbar-logo">RK Associates - Client Portal</div>
    <div class="navbar-menu">
      <a onclick="logout()">Logout</a>
    </div>
    <div class="user-info" id="userInfo"></div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab-btn" onclick="switchTab('tickets')">My Tickets</button>
      <button class="tab-btn" onclick="switchTab('create-ticket')">Create Ticket</button>
      <button class="tab-btn" onclick="switchTab('files')">Files</button>
      <button class="tab-btn" onclick="switchTab('courses')">My Courses</button>
    </div>

    <!-- Dashboard Tab -->
    <div id="dashboard" class="tab-content active">
      <h2 style="margin-bottom: 20px;">Dashboard</h2>
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalTickets">0</div>
          <div class="stat-label">Total Tickets</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="openTickets">0</div>
          <div class="stat-label">Open Tickets</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="resolvedTickets">0</div>
          <div class="stat-label">Resolved</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="enrolledCourses">0</div>
          <div class="stat-label">Courses Enrolled</div>
        </div>
      </div>

      <h3 style="margin-top: 30px; margin-bottom: 16px;">Recent Tickets</h3>
      <div id="recentTickets" class="tickets-list"></div>
    </div>

    <!-- My Tickets Tab -->
    <div id="tickets" class="tab-content">
      <h2 style="margin-bottom: 20px;">My Tickets</h2>
      <div id="ticketsList" class="tickets-list"></div>
    </div>

    <!-- Create Ticket Tab -->
    <div id="create-ticket" class="tab-content">
      <h2 style="margin-bottom: 20px;">Create New Ticket</h2>
      <div style="background: white; padding: 20px; border-radius: 8px; max-width: 600px;">
        <div class="form-group">
          <label>Category *</label>
          <select id="ticketCategory" required>
            <option value="">Select Category</option>
            <option value="hr_policy">HR Policy</option>
            <option value="payroll">Payroll</option>
            <option value="compliance">Compliance</option>
            <option value="training">Training</option>
            <option value="general">General</option>
          </select>
        </div>

        <div class="form-group">
          <label>Priority *</label>
          <select id="ticketPriority" required>
            <option value="">Select Priority</option>
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>

        <div class="form-group">
          <label>Subject *</label>
          <input type="text" id="ticketSubject" placeholder="Brief subject of your query" required>
        </div>

        <div class="form-group">
          <label>Description *</label>
          <textarea id="ticketDescription" placeholder="Detailed description of your query..." required></textarea>
        </div>

        <button class="btn btn-primary" onclick="createTicket()">Create Ticket</button>
      </div>
    </div>

    <!-- Files Tab -->
    <div id="files" class="tab-content">
      <h2 style="margin-bottom: 20px;">Files & Documents</h2>
      <div style="margin-bottom: 20px;">
        <input type="file" id="fileInput" style="padding: 10px; border: 1px dashed #ddd; border-radius: 4px; width: 100%; cursor: pointer;">
        <button class="btn btn-primary" onclick="uploadFile()" style="margin-top: 10px;">Upload File</button>
      </div>
      <div id="filesList" class="files-grid"></div>
    </div>

    <!-- Courses Tab -->
    <div id="courses" class="tab-content">
      <h2 style="margin-bottom: 20px;">My Courses</h2>
      <div id="coursesList" style="background: white; padding: 20px; border-radius: 8px;"></div>
    </div>
  </div>

  <!-- Ticket Detail Modal -->
  <div id="ticketModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeTicketModal()">&times;</span>
      <h2 id="modalTicketNumber" style="margin-bottom: 16px;"></h2>

      <div id="modalTicketDetails" style="margin-bottom: 20px;"></div>

      <h3 style="margin-bottom: 16px;">Comments</h3>
      <div id="modalComments" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>

      <div class="form-group">
        <label>Add Comment</label>
        <textarea id="commentText" placeholder="Your comment..." style="min-height: 80px;"></textarea>
      </div>

      <button class="btn btn-primary" onclick="addComment()">Post Comment</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://rk-associate.vliab.workers.dev/api';
    let authToken = localStorage.getItem('authToken');
    let currentUserId = localStorage.getItem('userId');
    let currentTicketId = null;

    // Check Auth
    if (!authToken) {
      window.location.href = '/login';
    }

    // Display User Info
    function displayUserInfo() {
      const userName = localStorage.getItem('userName') || 'User';
      document.getElementById('userInfo').innerHTML = `<span>Welcome, ${userName}</span>`;
    }

    // Tab Switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'tickets') loadTickets();
      if (tabName === 'files') loadFiles();
      if (tabName === 'courses') loadCourses();
      if (tabName === 'dashboard') loadDashboard();
    }

    // Load Dashboard
    async function loadDashboard() {
      try {
        const res = await fetch(`${API_URL}/tickets`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();

        if (data.success) {
          const tickets = data.tickets;
          document.getElementById('totalTickets').textContent = tickets.length;
          document.getElementById('openTickets').textContent = tickets.filter(t => t.status === 'open').length;
          document.getElementById('resolvedTickets').textContent = tickets.filter(t => t.status === 'resolved').length;

          const recent = tickets.slice(0, 5);
          document.getElementById('recentTickets').innerHTML = recent.map(t => `
            <div class="ticket-item" onclick="openTicket('${t.id}')">
              <div class="ticket-info">
                <div class="ticket-number">${t.ticket_number}</div>
                <div class="ticket-subject">${t.subject}</div>
                <div class="ticket-date">Created: ${new Date(t.created_at).toLocaleDateString()}</div>
              </div>
              <span class="ticket-status status-${t.status}">${t.status.toUpperCase()}</span>
              <span class="priority priority-${t.priority}">${t.priority}</span>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
      }
    }

    // Load Tickets
    async function loadTickets() {
      try {
        const res = await fetch(`${API_URL}/tickets`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('ticketsList').innerHTML = data.tickets.map(t => `
            <div class="ticket-item" onclick="openTicket('${t.id}')">
              <div class="ticket-info">
                <div class="ticket-number">${t.ticket_number}</div>
                <div class="ticket-subject">${t.subject}</div>
                <div class="ticket-date">Created: ${new Date(t.created_at).toLocaleDateString()}</div>
              </div>
              <span class="ticket-status status-${t.status}">${t.status.toUpperCase()}</span>
              <span class="priority priority-${t.priority}">${t.priority}</span>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading tickets:', error);
      }
    }

    // Create Ticket
    async function createTicket() {
      const category = document.getElementById('ticketCategory').value;
      const subject = document.getElementById('ticketSubject').value;
      const description = document.getElementById('ticketDescription').value;
      const priority = document.getElementById('ticketPriority').value;

      if (!category || !subject || !description) {
        alert('Please fill all required fields');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/tickets`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ category, subject, description, priority })
        });

        const data = await res.json();
        if (data.success) {
          alert('Ticket created: ' + data.ticket.ticket_number);
          document.getElementById('ticketCategory').value = '';
          document.getElementById('ticketSubject').value = '';
          document.getElementById('ticketDescription').value = '';
          document.getElementById('ticketPriority').value = 'medium';
        }
      } catch (error) {
        console.error('Error creating ticket:', error);
      }
    }

    // Open Ticket Modal
    async function openTicket(ticketId) {
      currentTicketId = ticketId;
      // Load and display ticket details
      document.getElementById('ticketModal').classList.add('active');
    }

    // Close Modal
    function closeTicketModal() {
      document.getElementById('ticketModal').classList.remove('active');
      currentTicketId = null;
    }

    // Add Comment
    async function addComment() {
      const comment = document.getElementById('commentText').value;
      if (!comment || !currentTicketId) return;

      try {
        const res = await fetch(`${API_URL}/tickets/${currentTicketId}/comments`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ comment })
        });

        if ((await res.json()).success) {
          document.getElementById('commentText').value = '';
          // Reload comments
        }
      } catch (error) {
        console.error('Error adding comment:', error);
      }
    }

    // Upload File
    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file || !currentTicketId) {
        alert('Please select a file and open a ticket');
        return;
      }

      // TODO: Upload to S3/R2
      alert('File upload will be integrated with S3/R2');
    }

    // Load Files
    async function loadFiles() {
      // TODO: Load files from current ticket or all files
      document.getElementById('filesList').innerHTML = '<p>No files yet</p>';
    }

    // Load Courses
    async function loadCourses() {
      document.getElementById('coursesList').innerHTML = '<p>Loading your enrolled courses...</p>';
      // TODO: Load from enrollments table
    }

    // Logout
    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('userId');
      localStorage.removeItem('userName');
      window.location.href = '/login';
    }

    // Initialize
    displayUserInfo();
    loadDashboard();
  </script>
</body>
</html>
