# RK Associates backend API. Deliberately NOT named "rk-associate": that name is the live
# Next.js site, and deploying over it would replace the website.
name = "rk-associate-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ac58b62e8f62115bb2a73be4a5202360"
workers_dev = true

[vars]
APP_ENV = "production"
# Comma-separated list of origins allowed to call the API cross-origin (same-origin needs nothing).
ALLOWED_ORIGINS = "https://rk-associate.vliab.workers.dev"

# Secrets (set with `wrangler secret put NAME`, never commit):
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# SENDGRID_API_KEY, SENDGRID_FROM_EMAIL

# R2 bucket for ticket attachments and certificates. Create once: wrangler r2 bucket create rk-associate-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "rk-associate-files"

[observability]
enabled = true

# Cloudflare Rate Limiting binding: brute-force protection for auth endpoints (per IP).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
